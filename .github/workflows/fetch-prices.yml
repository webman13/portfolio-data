name: fetch-prices
on:
  schedule:
    - cron: '5 20 * * 1-5'   # 22:05 poleti (po zaprtju ZDA)
    - cron: '5 21 * * 1-5'   # 22:05 pozimi (po zaprtju ZDA)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "prices $(date -u +%F)"
          git push
